<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cat logo, half rose pink and half black">
  <defs>
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="50" height="100"/>
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="50" y="0" width="50" height="100"/>
    </clipPath>
  </defs>

  <!-- Left (rose) half -->
  <g clip-path="url(#leftHalf)" fill="#FF6B9D">
    <path d="M50 20 L20 2 L26 28 Z"/>
    <ellipse cx="50" cy="55" rx="34" ry="30"/>
    <circle cx="38" cy="52" r="3.2" fill="#1A1A1A"/>
    <path d="M50 60 L44 66 L56 66 Z" fill="#E0396B"/>
    <path d="M12 50 H30" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M12 58 H30" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M14 42 H30" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Right (black) half -->
  <g clip-path="url(#rightHalf)" fill="#1A1A1A">
    <path d="M50 20 L80 2 L74 28 Z"/>
    <ellipse cx="50" cy="55" rx="34" ry="30"/>
    <circle cx="62" cy="52" r="3.2" fill="#FF6B9D"/>
    <path d="M50 60 L44 66 L56 66 Z" fill="#FF6B9D"/>
    <path d="M70 50 H88" stroke="#FF6B9D" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M70 58 H88" stroke="#FF6B9D" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M70 42 H86" stroke="#FF6B9D" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Center seam -->
  <line x1="50" y1="6" x2="50" y2="86" stroke="#ffffff" stroke-width="0.6" opacity="0.4"/>
</svg>
